# VOXEL-SAM AR — Phase 5: CI gates.
#
# backend: every Python file compiles + ruff is clean + e2e.sh parses.
# web:     the Vite console type-checks (tsc --noEmit).
# golden:  the deterministic demo geometry still matches the committed
#          assets/expected_geometry.json (light deps, no GPU/secrets).
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all backend files
        run: python -m compileall -q modal baseten agent scripts
      - name: Lint with ruff
        run: |
          pip install "ruff==0.17.3"
          ruff check modal baseten agent scripts
      - name: Check e2e.sh syntax
        run: bash -n scripts/e2e.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light geometry deps
        run: pip install "numpy>=1.26,<3" pillow "pydantic>=2.7"
      - name: Golden geometry test
        run: python scripts/make_demo_assets.py --check
